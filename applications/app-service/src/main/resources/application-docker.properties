# Conexión R2DBC a la base de datos MySQL del contenedor mysql-autenticacion
spring.r2dbc.url=r2dbc:mysql://mysql-autenticacion:3306/autenticacion
spring.r2dbc.username=admin
spring.r2dbc.password=5697964c

# Puerto interno del contenedor
server.port=8080

# Pool de conexiones R2DBC
spring.r2dbc.pool.initial-size=5
spring.r2dbc.pool.max-size=10

# Inicialización de scripts SQL (si usás spring.sql.init)
spring.sql.init.mode=always

# Logging detallado para trazabilidad
logging.level.com.tuempresa.autenticacion=DEBUG
logging.level.io.r2dbc=DEBUG

# Sobrescribir configuración personalizada para Docker
adapters.r2dbc.mysql.host=mysql-autenticacion
adapters.r2dbc.mysql.port=3306
adapters.r2dbc.mysql.database=autenticacion
adapters.r2dbc.mysql.username=admin
adapters.r2dbc.mysql.password=5697964c